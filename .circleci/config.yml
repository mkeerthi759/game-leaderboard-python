
version: 2.1

jobs:
  lint:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install dependencies and Ruff
          command: pip install -r requirements.txt ruff
      - run:
          name: Run Ruff
          command: ruff check app tests

  unit-tests:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install test dependencies
          command: pip install -r requirements.txt pytest pytest-cov
      - run:
          name: Run unit tests with coverage
          command: PYTHONPATH=. pytest -q --cov=app.scoring --cov-report=term-missing --cov-fail-under=70 tests/test_scoring.py

  integration-tests:
    docker:
      - image: cimg/python:3.12
        environment:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379/0
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
      - image: redis:7-alpine

    steps:
      - checkout

      - run:
          name: Install test dependencies
          command: pip install -r requirements.txt pytest

      - run:
          name: Wait for PostgreSQL
          command: |
            for i in $(seq 1 30); do
              if python -c "import os, psycopg; psycopg.connect(os.environ['DATABASE_URL']).close()" 2>/dev/null; then
                echo "PostgreSQL is ready"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "PostgreSQL did not become ready in time" >&2
                exit 1
              fi
              echo "Waiting for PostgreSQL... ($i/30)"
              sleep 2
            done

      - run:
          name: Wait for Redis
          command: |
            for i in $(seq 1 30); do
              if python -c "import os, redis; redis.Redis.from_url(os.environ['REDIS_URL']).ping()" 2>/dev/null; then
                echo "Redis is ready"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Redis did not become ready in time" >&2
                exit 1
              fi
              echo "Waiting for Redis... ($i/30)"
              sleep 2
            done

      - run:
          name: Apply database migrations
          command: |
            python -c "import os; from pathlib import Path; import psycopg; conn=psycopg.connect(os.environ['DATABASE_URL']); conn.execute((Path('migrations') / '001_schema.sql').read_text(encoding='utf-8'), prepare=False); conn.execute((Path('migrations') / '002_seed.sql').read_text(encoding='utf-8'), prepare=False); conn.commit(); conn.close(); print('Database migrations completed successfully')"

      - run:
          name: Run integration tests
          command: PYTHONPATH=. pytest -q tests/test_integration.py

workflows:
  build-test-and-scan:
    jobs:
      - lint
      - unit-tests
      - integration-tests:
          requires:
            - lint
            - unit-tests
