version: 2.1

executors:
  python-executor:
    docker:
      - image: cimg/python:3.11
      - image: cimg/postgres:16.0
        environment:
          POSTGRES_USER:     leaderboard
          POSTGRES_PASSWORD: leaderboard
          POSTGRES_DB:       leaderboard
      - image: cimg/redis:7.2

commands:
  install-deps:
    description: "Install Python dependencies"
    steps:
      - run:
          name: Install dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

  wait-for-db:
    description: "Wait until Postgres accepts connections"
    steps:
      - run:
          name: Wait for Postgres
          command: |
            for i in $(seq 1 30); do
              pg_isready -h localhost -p 5432 -U leaderboard && break
              echo "Waiting for Postgres… ($i)"
              sleep 2
            done

  wait-for-redis:
    description: "Wait until Redis accepts connections"
    steps:
      - run:
          name: Wait for Redis
          command: |
            for i in $(seq 1 30); do
              redis-cli -h localhost ping && break
              echo "Waiting for Redis… ($i)"
              sleep 2
            done

jobs:

  secret-scan:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Install gitleaks
          command: |
            GITLEAKS_VERSION=8.18.4
            curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              | sudo tar -xz -C /usr/local/bin gitleaks
            gitleaks version
      - run:
          name: Scan for secrets
          command: |
            gitleaks detect --source=. --redact --no-banner --verbose --exit-code=1

  lint:
    executor: python-executor
    steps:
      - checkout
      - install-deps
      - run:
          name: Run linter
          command: |
            . venv/bin/activate
            pip install ruff
            ruff check .

  unit-tests:
    executor: python-executor
    steps:
      - checkout
      - install-deps
      - run:
          name: Run unit tests
          command: |
            . venv/bin/activate
            pytest tests/ -v -m "not integration"

  integration-tests:
    executor: python-executor
    environment:
      DATABASE_URL: postgresql://leaderboard:leaderboard@localhost:5432/leaderboard
      REDIS_URL:    redis://localhost:6379/0
    steps:
      - checkout
      - install-deps
      - wait-for-db
      - wait-for-redis
      - run:
          name: Run migrations
          command: |
            . venv/bin/activate
            alembic upgrade head
      - run:
          name: Run integration tests
          command: |
            . venv/bin/activate
            pytest tests/ -v -m integration

  build-and-push:
    parameters:
      tag:
        type: string
        description: "Moving tag (:qa / :stage / :prod)"
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - setup_remote_docker:
          version: docker24
      - run:
          name: Compute image tags
          command: |
            SHORT_SHA=$(echo "$CIRCLE_SHA1" | cut -c1-7)
            echo "export IMMUTABLE_TAG=${CIRCLE_BRANCH}-${SHORT_SHA}" >> "$BASH_ENV"
            echo "export MOVING_TAG=<< parameters.tag >>" >> "$BASH_ENV"
      - run:
          name: Build image
          command: |
            docker build \
              -t "${DOCKERHUB_USER}/game-leaderboard:${MOVING_TAG}" \
              -t "${DOCKERHUB_USER}/game-leaderboard:${IMMUTABLE_TAG}" \
              .
      - run:
          name: Push image
          command: |
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
            docker push "${DOCKERHUB_USER}/game-leaderboard:${MOVING_TAG}"
            docker push "${DOCKERHUB_USER}/game-leaderboard:${IMMUTABLE_TAG}"

workflows:
  version: 2

  qa-pipeline:
    jobs:
      - secret-scan:
          filters: { branches: { only: main } }
      - lint:
          requires: [secret-scan]
          filters: { branches: { only: main } }
      - unit-tests:
          requires: [lint]
          filters: { branches: { only: main } }
      - integration-tests:
          requires: [unit-tests]
          filters: { branches: { only: main } }
      - build-and-push:
          name: build-and-push-qa
          tag: qa
          requires: [integration-tests]
          filters: { branches: { only: main } }

  staging-pipeline:
    jobs:
      - build-and-push:
          name: build-and-push-stage
          tag: stage
          filters: { branches: { only: staging } }

  prod-pipeline:
    jobs:
      - build-and-push:
          name: build-and-push-prod
          tag: prod
          filters: { branches: { only: prod } }