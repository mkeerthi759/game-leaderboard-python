version: 2.1

jobs:
  lint:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install dependencies and Ruff
          command: pip install -r requirements.txt ruff
      - run:
          name: Run Ruff
          command: ruff check app tests

  unit-tests:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install test dependencies
          command: pip install -r requirements.txt pytest pytest-cov
      - run:
          name: Run unit tests with coverage
          command: PYTHONPATH=. pytest -q --cov=app.scoring --cov-report=term-missing --cov-fail-under=70 tests/test_scoring.py

  integration-tests:
    docker:
      - image: cimg/python:3.12
        environment:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
    steps:
      - checkout
      - run:
          name: Install test dependencies
          command: pip install -r requirements.txt pytest
      - run:
          name: Wait for Postgres to be ready
          command: |
            for i in $(seq 1 30); do
              if pg_isready -h localhost -p 5432 -U postgres; then
                echo "Postgres is ready"
                exit 0
              fi
              echo "Waiting for Postgres... ($i/30)"
              sleep 2
            done
            echo "Postgres did not become ready in time" >&2
            exit 1
      - run:
          name: Run integration tests
          command: PYTHONPATH=. pytest -q tests/test_integration.py

workflows:
  build-test-and-scan:
    jobs:
      - lint
      - unit-tests
      - integration-tests:
          requires:
            - lint
            - unit-tests