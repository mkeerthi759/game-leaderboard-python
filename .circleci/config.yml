version: 2.1

executors:
  python-executor:
    docker:
      - image: cimg/python:3.11
      - image: cimg/postgres:16.0
        environment:
          POSTGRES_USER:     leaderboard
          POSTGRES_PASSWORD: leaderboard
          POSTGRES_DB:       leaderboard
      - image: cimg/redis:7.2

jobs:

  secret-scan:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Install gitleaks
          command: |
            GITLEAKS_VERSION=8.18.4
            curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              | sudo tar -xz -C /usr/local/bin gitleaks
            gitleaks version
      - run:
          name: Scan for secrets
          command: |
            gitleaks detect --source=. --redact --no-banner --verbose --exit-code=1

  lint:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt ruff
      - run:
          name: Run Ruff
          command: |
            . venv/bin/activate
            ruff check app tests

  unit-tests:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt pytest pytest-cov
      - run:
          name: Run unit tests with coverage
          command: |
            . venv/bin/activate
            PYTHONPATH=. pytest -q --cov=app.scoring --cov-report=term-missing --cov-fail-under=70 tests/test_scoring.py

  integration-tests:
    executor: python-executor
    environment:
      DATABASE_URL: postgresql://leaderboard:leaderboard@localhost:5432/leaderboard
      REDIS_URL:    redis://localhost:6379/0
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt pytest
      - run:
          name: Wait for PostgreSQL
          command: |
            for i in $(seq 1 30); do
              if python -c "import os, psycopg; psycopg.connect(os.environ['DATABASE_URL']).close()" 2>/dev/null; then
                echo "PostgreSQL is ready"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "PostgreSQL did not become ready in time" >&2
                exit 1
              fi
              echo "Waiting for PostgreSQL... ($i/30)"
              sleep 2
            done
      - run:
          name: Wait for Redis
          command: |
            for i in $(seq 1 30); do
              if python -c "import os, redis; redis.Redis.from_url(os.environ['REDIS_URL']).ping()" 2>/dev/null; then
                echo "Redis is ready"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Redis did not become ready in time" >&2
                exit 1
              fi
              echo "Waiting for Redis... ($i/30)"
              sleep 2
            done
      - run:
          name: Apply database migrations
          command: |
            python -c "import os; from pathlib import Path; import psycopg; conn=psycopg.connect(os.environ['DATABASE_URL']); conn.execute((Path('migrations') / '001_schema.sql').read_text(encoding='utf-8'), prepare=False); conn.execute((Path('migrations') / '002_seed.sql').read_text(encoding='utf-8'), prepare=False); conn.commit(); conn.close(); print('Database migrations completed successfully')"
      - run:
          name: Run integration tests
          command: |
            . venv/bin/activate
            PYTHONPATH=. pytest -q tests/test_integration.py

  build-and-push:
    parameters:
      tag:
        type: string
        description: "Moving tag (qa / stage / prod)"
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - setup_remote_docker:
          version: docker24
      - run:
          name: Compute image tags
          command: |
            SHORT_SHA=$(echo "$CIRCLE_SHA1" | cut -c1-7)
            echo "export IMMUTABLE_TAG=${CIRCLE_BRANCH}-${SHORT_SHA}" >> "$BASH_ENV"
            echo "export MOVING_TAG=<< parameters.tag >>" >> "$BASH_ENV"
      - run:
          name: Build image
          command: |
            docker build \
              -t "${DOCKERHUB_USER}/game-leaderboard:${MOVING_TAG}" \
              -t "${DOCKERHUB_USER}/game-leaderboard:${IMMUTABLE_TAG}" \
              .
      - run:
          name: Push image
          command: |
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
            docker push "${DOCKERHUB_USER}/game-leaderboard:${MOVING_TAG}"
            docker push "${DOCKERHUB_USER}/game-leaderboard:${IMMUTABLE_TAG}"

workflows:
  version: 2

  qa-pipeline:
    jobs:
      - secret-scan:
          filters: { branches: { only: main } }
      - lint:
          requires: [secret-scan]
          filters: { branches: { only: main } }
      - unit-tests:
          requires: [lint]
          filters: { branches: { only: main } }
      - integration-tests:
          requires: [unit-tests]
          filters: { branches: { only: main } }
      - build-and-push:
          name: build-and-push-qa
          tag: qa
          requires: [integration-tests]
          filters: { branches: { only: main } }

  staging-pipeline:
    jobs:
      - build-and-push:
          name: build-and-push-stage
          tag: stage
          filters: { branches: { only: staging } }

  prod-pipeline:
    jobs:
      - build-and-push:
          name: build-and-push-prod
          tag: prod
          filters: { branches: { only: prod } }